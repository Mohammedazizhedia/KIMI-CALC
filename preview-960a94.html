<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" id="metaTheme" content="#F8F7F3">
<title>Calculator — حاسبة</title>
<style>
/* ============ Fonts (uploaded set, same spirit as FindIt: Cairo/Tajawal/Amiri) ============ */
@font-face{font-family:'Cairo';src:url('fonts/Cairo-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'PlexArabic';src:url('fonts/IBMPlexSansArabic-Bold.ttf') format('truetype');font-weight:700}
@font-face{font-family:'Camel';src:url('fonts/TheYearofTheCamel-ExtraBold.otf.ttf') format('opentype');font-weight:800}

/* ============ FindIt Design Tokens ============ */
:root{
  --bg:#F8F7F3; --surface:#FDFDFB; --surfaceVariant:#EFEDE6;
  --onSurface:#1B1C1A; --onSurfaceVariant:#44463F; --outline:#75776C;
  --primary:#185FA5; --onPrimary:#FFFFFF; --primaryContainer:#D6E7F9; --onPrimaryContainer:#0B3E6F;
  --success:#3B6D11; --successBg:#EAF3DE;
  --danger:#A32D2D; --dangerBg:#FCEBEB;
  --warning:#854F0B; --warningBg:#FAEEDA;
  --radius-lg:28px; --radius-md:22px; --radius-sm:16px;
  --shadow:0 10px 30px rgba(27,28,26,.10);
}
[data-theme="dark"]{
  --bg:#0F100E; --surface:#131412; --surfaceVariant:#2C2C2A;
  --onSurface:#E4E3DD; --onSurfaceVariant:#C6C7BF; --outline:#8F9186;
  --primary:#B5D4F4; --onPrimary:#0C2C4E; --primaryContainer:#14395C; --onPrimaryContainer:#CFE3F8;
}
[data-accent="teal"]{--primary:#0F766E;--onPrimary:#fff;--primaryContainer:#99F6E4;--onPrimaryContainer:#134E4A}
[data-accent="teal"][data-theme="dark"]{--primary:#5EEAD4;--onPrimary:#06302B;--primaryContainer:#0B3B36;--onPrimaryContainer:#8CE8D4}
[data-accent="indigo"]{--primary:#4F46E5;--onPrimary:#fff;--primaryContainer:#E0E7FF;--onPrimaryContainer:#3730A3}
[data-accent="indigo"][data-theme="dark"]{--primary:#A5B4FC;--onPrimary:#1E1B4B;--primaryContainer:#2A2753;--onPrimaryContainer:#C7D2FE}
[data-accent="amber"]{--primary:#B45309;--onPrimary:#fff;--primaryContainer:#FDE68A;--onPrimaryContainer:#78350F}
[data-accent="amber"][data-theme="dark"]{--primary:#FBBF24;--onPrimary:#4A2B00;--primaryContainer:#4A3410;--onPrimaryContainer:#FCD34D}
[data-accent="rose"]{--primary:#BE123C;--onPrimary:#fff;--primaryContainer:#FECDD3;--onPrimaryContainer:#881337}
[data-accent="rose"][data-theme="dark"]{--primary:#FDA4AF;--onPrimary:#590D22;--primaryContainer:#571C28;--onPrimaryContainer:#FDA4AF}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{
  font-family:'Cairo',sans-serif;
  background:var(--bg);color:var(--onSurface);
  display:flex;flex-direction:column;height:100dvh;
  transition:background .35s ease,color .35s ease;
  overflow:hidden;
}
[dir="ltr"] body{direction:ltr}

/* ============ Top bar ============ */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.app-title{font-family:'Camel';font-size:20px;font-weight:800;color:var(--primary);letter-spacing:.5px;flex:1}
.icon-btn{
  width:42px;height:42px;border:none;border-radius:50%;
  background:var(--surfaceVariant);color:var(--onSurfaceVariant);
  font-size:19px;cursor:pointer;display:grid;place-items:center;
  transition:transform .12s ease, background .2s;
}
.icon-btn:active{transform:scale(.88)}
.icon-btn.mic-live{background:var(--dangerBg);color:var(--danger);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(163,45,45,.35)}50%{box-shadow:0 0 0 12px rgba(163,45,45,0)}}

/* ============ Display ============ */
.display{
  flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;
  padding:12px 24px 18px;gap:6px;min-height:120px;overflow:hidden;direction:ltr;text-align:right;
}
.expr{
  font-family:'PlexArabic';font-size:clamp(18px,4.5vw,26px);font-weight:700;
  color:var(--onSurfaceVariant);word-break:break-all;max-width:100%;
  transition:opacity .2s;
}
.result{
  font-family:'Camel';font-size:clamp(38px,10vw,64px);font-weight:800;
  color:var(--onSurface);line-height:1.1;word-break:break-all;max-width:100%;
  direction:ltr;
}
.result.small{font-size:clamp(26px,7vw,44px)}
.badge{
  font-size:12px;padding:4px 12px;border-radius:999px;font-weight:700;
  background:var(--primaryContainer);color:var(--onPrimaryContainer);
  opacity:0;transition:opacity .3s;
}
.badge.show{opacity:1}

/* ============ Keys ============ */
.keys{
  background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow:var(--shadow);
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  padding:18px 14px calc(18px + env(safe-area-inset-bottom));
}
.key{
  height:64px;border:none;border-radius:var(--radius-md);cursor:pointer;
  font-family:'PlexArabic';font-size:24px;font-weight:700;color:var(--onSurface);
  background:var(--surfaceVariant);
  transition:transform .1s ease, filter .15s;
}
.key:active{transform:scale(.92);filter:brightness(.94)}
.key.fn{background:var(--primaryContainer);color:var(--onPrimaryContainer)}
.key.op{background:var(--primary);color:var(--onPrimary);font-size:28px}
.key.eq{grid-row:span 2;height:auto}
.key.clr{background:var(--dangerBg);color:var(--danger)}
.key.zero{grid-column:span 2}
.key.mic{grid-column:span 2;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
[dir="ltr"] .key.mic{direction:ltr}
.voice-hint{font-size:12px;color:var(--outline)}

/* ============ Sheet (theme / accent / lang) ============ */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(15,16,14,.45);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;
}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:21;
  background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:20px 22px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:70dvh;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet h3{font-family:'Camel';font-size:18px;margin-bottom:14px;color:var(--onSurface)}
.sheet .close{position:absolute;top:14px;inset-inline-end:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--surfaceVariant)}
.row:last-child{border-bottom:none}
.row-label{font-weight:700;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  border:none;border-radius:999px;padding:8px 16px;cursor:pointer;
  font-family:'Cairo';font-weight:700;font-size:13px;
  background:var(--surfaceVariant);color:var(--onSurfaceVariant);
}
.chip.on{background:var(--primary);color:var(--onPrimary)}
.dots{display:flex;gap:10px}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.dot.on{border-color:var(--onSurface);transform:scale(1.1)}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:var(--surfaceVariant);border:none;cursor:pointer;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--onSurfaceVariant);transition:all .2s}
.switch.on{background:var(--primary)}
.switch.on::after{inset-inline-start:25px;background:var(--onPrimary)}

/* ============ Toast ============ */
.toast{
  position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--onSurface);color:var(--bg);padding:10px 20px;border-radius:999px;
  font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:30;
  max-width:85vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body data-accent="default">

<header class="topbar">
  <div class="app-title" id="appTitle">حاسبة</div>
  <button class="icon-btn" id="btnRound" title="تقريب — Round">⌊x⌉</button>
  <button class="icon-btn" id="btnSpeak" title="قراءة النتيجة">🔊</button>
  <button class="icon-btn" id="btnSettings">⚙️</button>
</header>

<main class="display" aria-live="polite">
  <div class="badge" id="voiceBadge"></div>
  <div class="expr" id="expr">&nbsp;</div>
  <div class="result" id="result">0</div>
</main>

<section class="keys" id="keys"></section>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <button class="icon-btn close" id="btnCloseSheet">✕</button>
  <h3 id="sheetTitle">الإعدادات</h3>

  <div class="row"><span class="row-label" id="lblMode">المظهر</span>
    <div class="chips" id="modeChips">
      <button class="chip" data-mode="system" id="mSystem">تلقائي</button>
      <button class="chip" data-mode="light" id="mLight">فاتح</button>
      <button class="chip" data-mode="dark" id="mDark">داكن</button>
    </div>
  </div>

  <div class="row"><span class="row-label" id="lblAccent">لون التمييز</span>
    <div class="dots" id="accentDots">
      <button class="dot on" data-accent="default" style="background:#185FA5" title="أزرق"></button>
      <button class="dot" data-accent="teal" style="background:#0F766E" title="تيل"></button>
      <button class="dot" data-accent="indigo" style="background:#4F46E5" title="نيلي"></button>
      <button class="dot" data-accent="amber" style="background:#B45309" title="عنبري"></button>
      <button class="dot" data-accent="rose" style="background:#BE123C" title="وردي"></button>
    </div>
  </div>

  <div class="row"><span class="row-label" id="lblLang">لغة الواجهة</span>
    <div class="chips" id="langChips">
      <button class="chip on" data-lang="ar">العربية</button>
      <button class="chip" data-lang="en">English</button>
    </div>
  </div>

  <div class="row"><span class="row-label" id="lblVoiceLang">لغة الأوامر الصوتية</span>
    <div class="chips" id="voiceChips">
      <button class="chip on" data-voice="ar-EG">العربية</button>
      <button class="chip" data-voice="en-US">English</button>
    </div>
  </div>

  <div class="row"><span class="row-label" id="lblTTS">قراءة النتيجة صوتيًا</span>
    <button class="switch on" id="ttsSwitch" aria-label="TTS"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   Calculator — FindIt identity · Arabic + English voice commands
   ================================================================ */
const $ = s => document.querySelector(s);

/* ---------- i18n ---------- */
const T = {
  ar: {
    title:'حاسبة', settings:'الإعدادات', mode:'المظهر', accent:'لون التمييز',
    lang:'لغة الواجهة', voiceLang:'لغة الأوامر الصوتية', tts:'قراءة النتيجة صوتيًا',
    system:'تلقائي', light:'فاتح', dark:'داكن',
    mic:'🎤 تحدث', listening:'أستمع… تحدث الآن',
    unsupported:'المتصفح لا يدعم التعرف على الصوت — جرّب Chrome',
    noResult:'لا توجد نتيجة بعد', cleared:'تم المسح', rounded:'تم التقريب لأقرب عدد صحيح',
    voiceOn:'الأوامر الصوتية: "سبعة زائد ثلاثة" · "امسح" · "وضع داكن"',
    understood:'فهمت:', error:'تعذّر الحساب',
  },
  en: {
    title:'Calculator', settings:'Settings', mode:'Appearance', accent:'Accent color',
    lang:'Interface language', voiceLang:'Voice command language', tts:'Speak result aloud',
    system:'Auto', light:'Light', dark:'Dark',
    mic:'🎤 Speak', listening:'Listening… speak now',
    unsupported:'Speech recognition not supported — try Chrome',
    noResult:'No result yet', cleared:'Cleared', rounded:'Rounded to nearest integer',
    voiceOn:'Voice commands: "seven plus three" · "clear" · "dark mode"',
    understood:'Heard:', error:'Cannot compute',
  }
};

/* ---------- State ---------- */
const state = {
  expr: '', lastResult: null, justEvaluated: false,
  themeMode: localStorage.getItem('themeMode') || 'system',
  accent: localStorage.getItem('accent') || 'default',
  lang: localStorage.getItem('lang') || 'ar',
  voiceLang: localStorage.getItem('voiceLang') || 'ar-EG',
  tts: localStorage.getItem('tts') !== '0',
};

/* ---------- Theme ---------- */
function applyTheme() {
  const dark = state.themeMode === 'dark' ||
    (state.themeMode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.dataset.theme = dark ? 'dark' : 'light';
  document.body.dataset.accent = state.accent;
  $('#metaTheme').content = dark ? '#0F100E' : '#F8F7F3';
  document.querySelectorAll('#modeChips .chip').forEach(c =>
    c.classList.toggle('on', c.dataset.mode === state.themeMode));
  document.querySelectorAll('#accentDots .dot').forEach(d =>
    d.classList.toggle('on', d.dataset.accent === state.accent));
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ---------- i18n apply ---------- */
function applyLang() {
  const t = T[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  $('#appTitle').textContent = t.title;
  $('#sheetTitle').textContent = t.settings;
  $('#lblMode').textContent = t.mode;
  $('#lblAccent').textContent = t.accent;
  $('#lblLang').textContent = t.lang;
  $('#lblVoiceLang').textContent = t.voiceLang;
  $('#lblTTS').textContent = t.tts;
  $('#mSystem').textContent = t.system;
  $('#mLight').textContent = t.light;
  $('#mDark').textContent = t.dark;
  $('#micBtnText') && ($('#micBtnText').textContent = t.mic);
  document.querySelectorAll('#langChips .chip').forEach(c =>
    c.classList.toggle('on', c.dataset.lang === state.lang));
  document.querySelectorAll('#voiceChips .chip').forEach(c =>
    c.classList.toggle('on', c.dataset.voice === state.voiceLang));
  $('#ttsSwitch').classList.toggle('on', state.tts);
  buildKeys();
}

/* ---------- Safe evaluator (shunting-yard, no eval) ---------- */
function tokenize(s) {
  const out = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9.]/.test(c)) {
      let n = '';
      while (i < s.length && /[0-9.]/.test(s[i])) n += s[i++];
      out.push({ type: 'num', val: parseFloat(n) });
      continue;
    }
    if ('+-×÷%√'.includes(c)) { out.push({ type: 'op', val: c }); i++; continue; }
    if (c === '(' || c === ')') { out.push({ type: 'par', val: c }); i++; continue; }
    throw new Error('bad char');
  }
  return out;
}
function evaluate(tokens) {
  // handle unary minus and √ as prefix, % as postfix on previous number
  const out = [], ops = [];
  const prec = { '+': 1, '-': 1, '×': 2, '÷': 2, '√': 3 };
  const apply = () => {
    const op = ops.pop();
    if (op === '√') { const a = out.pop(); out.push(Math.sqrt(a)); return; }
    const b = out.pop(), a = out.pop();
    if (a === undefined || b === undefined) throw new Error('syntax');
    let r;
    if (op === '+') r = a + b;
    if (op === '-') r = a - b;
    if (op === '×') r = a * b;
    if (op === '÷') { if (b === 0) throw new Error('div0'); r = a / b; }
    out.push(r);
  };
  let prev = null;
  for (const t of tokens) {
    if (t.type === 'num') {
      let v = t.val;
      if (prev && prev.type === 'op' && prev.val === '%') { ops.pop(); const a = out.pop(); v = a * v / 100; }
      out.push(v);
    } else if (t.type === 'op') {
      if (t.val === '√') { ops.push('√'); prev = t; continue; }
      // unary minus
      if (t.val === '-' && (!prev || (prev.type === 'op') || (prev.type === 'par' && prev.val === '('))) {
        out.push(0); ops.push('-'); prev = t; continue;
      }
      while (ops.length && prec[ops[ops.length-1]] >= prec[t.val]) apply();
      ops.push(t.val);
    } else if (t.val === '(') ops.push('(');
    else { while (ops.length && ops[ops.length-1] !== '(') apply(); ops.pop(); }
    prev = t;
  }
  while (ops.length) {
    if (ops[ops.length-1] === '(') throw new Error('syntax');
    apply();
  }
  if (out.length !== 1) throw new Error('syntax');
  return out[0];
}
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const r = Math.round(n * 1e10) / 1e10;
  return String(r).replace('.', state.lang === 'ar' ? '٫' : '.');
}

/* ---------- Display ---------- */
function render(exprOverride) {
  $('#expr').textContent = exprOverride !== undefined ? exprOverride : (state.expr || ' ');
  let r;
  if (state.expr) {
    try { r = fmt(evaluate(tokenize(state.expr))); } catch { r = $('#result').dataset.hold || '0'; }
  } else r = state.lastResult !== null ? fmt(state.lastResult) : '0';
  const resEl = $('#result');
  resEl.textContent = r;
  resEl.classList.toggle('small', r.length > 9);
}

/* ---------- Keys ---------- */
function buildKeys() {
  const t = T[state.lang];
  const rows = [
    ['C','fn clr'],['√','fn'],['%','fn'],['÷','op'],
    ['7',''],['8',''],['9',''],['×','op'],
    ['4',''],['5',''],['6',''],['−','op'],
    ['1',''],['2',''],['3',''],['+','op'],
    ['0','zero'],['.',''],['⌫','fn clr'],
  ];
  const k = $('#keys');
  k.innerHTML = '';
  rows.forEach(([label, cls]) => {
    const b = document.createElement('button');
    b.className = 'key ' + cls;
    b.textContent = label;
    b.addEventListener('click', () => pressKey(label));
    k.appendChild(b);
  });
  const mic = document.createElement('button');
  mic.className = 'key op mic';
  mic.innerHTML = '<span id="micBtnText">' + t.mic + '</span>';
  mic.addEventListener('click', toggleVoice);
  k.appendChild(mic);
  const eq = document.createElement('button');
  eq.className = 'key op eq';
  eq.textContent = '=';
  eq.addEventListener('click', () => pressKey('='));
  k.appendChild(eq);
}
function pressKey(label) {
  if (label === 'C') { state.expr = ''; state.lastResult = null; toast(T[state.lang].cleared); }
  else if (label === '⌫') state.expr = state.expr.slice(0, -1);
  else if (label === '=') return doEquals();
  else {
    if (state.justEvaluated && /[0-9.]/.test(label)) state.expr = '';
    state.justEvaluated = false;
    state.expr += label;
  }
  render();
}
function doEquals(silent) {
  if (!state.expr) return;
  try {
    const v = evaluate(tokenize(state.expr));
    state.lastResult = v; state.expr = ''; state.justEvaluated = true;
    render(); render('= ' + fmt(v));
    $('#result').dataset.hold = fmt(v);
    if (!silent) speakResult();
  } catch { toast(T[state.lang].error); }
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ================================================================
   Voice commands — Arabic (MSA + Egyptian) & English
   Inspired by FindIt's VoiceCommands parser (pure, offline-tolerant)
   ================================================================ */
const AR_NUM = {
  'صفر':'0','واحد':'1','واحدة':'1','اتنين':'2','اثنين':'2','اثنان':'2','تنين':'2','تلاتة':'3','ثلاثة':'3','ثلاث':'3',
  'اربعة':'4','أربعة':'4','اربع':'4','أربعين':'40','خمسة':'5','خمس':'5','ستة':'6','سته':'6','سبعة':'7','سبع':'7','ثمانية':'8',
  'ثمان':'8','تمانية':'8','تسعة':'9','تسع':'9','عشرة':'10','عشر':'10',
  'عشرين':'20','ثلاثين':'30','ثلاثون':'30','اربعين':'40','اربعون':'40','أربعون':'40','خمسين':'50','خمسون':'50','ستين':'60','ستون':'60','سبعين':'70','سبعون':'70','ثمانين':'80','ثمانون':'80','تسعين':'90','تسعون':'90',
  'مية':'100','مائة':'100','ميتين':'200','ألف':'1000','الف':'1000','مليون':'1000000',
};
const AR_OPS = [
  ['مضروب في','×'],['مقسوم على','÷'],['مضروبة','×'],['مضروب','×'],
  ['زائد','+'],['ناقص','-'],['طرح','-'],['ضرب','×'],['في','×'],
  ['قسمة','÷'],['على','÷'],['جذر','√'],['جزر','√'],['بالمية','%'],['بالمئة','%'],
  ['نسبة','%'],['يساوي','='],['يساوى','='],
];
const EN_NUM = {
  'zero':'0','one':'1','two':'2','three':'3','four':'4','five':'5','six':'6','seven':'7','eight':'8',
  'nine':'9','ten':'10','eleven':'11','twelve':'12','thirteen':'13','fourteen':'14','fifteen':'15',
  'sixteen':'16','seventeen':'17','eighteen':'18','nineteen':'19','twenty':'20','thirty':'30',
  'forty':'40','fifty':'50','sixty':'60','seventy':'70','eighty':'80','ninety':'90','hundred':'100','thousand':'1000',
  'million':'1000000','point':'.',
};
const EN_OPS = [
  ['square root of','√'],['multiplied by','×'],['divided by','÷'],['percent of','%'],
  ['added to','+'],['take away','-'],
  ['plus','+'],['add','+'],['minus','-'],['subtract','-'],['times','×'],['multiply','×'],
  ['divide','÷'],['by','÷'],['over','÷'],['root','√'],['percent','%'],['equals','='],
];

function normalizeDigits(s) {
  return s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function wordsToNumbers(tokens, lex) {
  // join consecutive number-words into numeric literals (handles "twenty one" / "خمسة وعشرين" / "two hundred and five")
  const out = [];
  let i = 0;
  const val = w => {
    const n = Number(w);
    if (!isNaN(n) && w !== '') return n;            // already a digit token
    if (lex[w] === undefined && /^و\S/.test(w) && lex[w.slice(1)] !== undefined) {
      w = w.slice(1);                                // Egyptian connector glued: "وعشرين" -> "عشرين"
    }
    if (lex[w] === undefined) return null;           // not a number word
    const x = Number(lex[w]);
    return isNaN(x) ? null : x;
  };
  while (i < tokens.length) {
    const v = val(tokens[i]);
    if (v !== null) {
      let acc = 0, cur = 0, j = i;
      while (j < tokens.length) {
        const w = tokens[j];
        if (w === 'and' || w === 'و') {           // connector: "hundred and five" / "خمسة وعشرين"
          if (j + 1 < tokens.length && val(tokens[j + 1]) !== null) { j++; continue; }
          break;
        }
        const x = val(w);
        if (x === null) break;
        if (x >= 100) { cur = (cur || 1) * x; acc += cur; cur = 0; }
        else cur += x;
        j++;
      }
      out.push(String(acc + cur));
      i = j;
    } else { out.push(tokens[i]); i++; }
  }
  return out;
}
function parseVoice(text) {
  const raw = normalizeDigits(text.trim().toLowerCase());
  if (!raw) return null;
  const isAr = /[\u0600-\u06FF]/.test(raw);
  let t = raw;

  // app-level commands (FindIt-style command parsing)
  const clearW = isAr ? ['امسح','امسى','بطل','مسح','امسحى'] : ['clear','erase','delete','reset'];
  const darkW  = isAr ? ['وضع داكن','داكن','ليلي','الوضع الليلي'] : ['dark mode','dark'];
  const lightW = isAr ? ['وضع فاتح','فاتح','نهاري'] : ['light mode','light'];
  const eqW    = isAr ? ['احسب','حسبلي','حسب','كم يساوي','اوجد','هات'] : ['calculate','compute','what is','what\'s'];
  const stopW  = isAr ? ['قف','استنى','كفاية'] : ['stop','cancel'];

  if (stopW.some(w => t === w || t.startsWith(w + ' '))) return { cmd: 'stop' };
  if (clearW.some(w => t.includes(w))) return { cmd: 'clear' };
  if (darkW.some(w => t.includes(w))) return { cmd: 'dark' };
  if (lightW.some(w => t.includes(w))) return { cmd: 'light' };

  if (isAr) {
    for (const [w, op] of AR_OPS) t = t.split(w).join(' ' + op + ' ');
    t = t.split('فاصلة').join(' . ').split('نقطة').join(' . ');
    const tokens = t.replace(/[؟?،,]/g, ' ').split(/\s+/).filter(Boolean);
    const joined = wordsToNumbers(tokens, AR_NUM).join(' ');
    return { cmd: 'expr', expr: joined.replace(new RegExp('\\s*([.\\-+×÷%√])\\s*', 'g'), '$1'), say: raw };
  }
  for (const [w, op] of EN_OPS) t = t.replace(new RegExp('\\b' + w.replace(/ /g, '\\s+') + '\\b', 'g'), ' ' + op + ' ');
  const tokens = t.replace(/[?!,]/g, ' ').replace(/\bpoint\b/g, ' . ').split(/\s+/).filter(Boolean);
  const joined = wordsToNumbers(tokens, EN_NUM).join(' ');
  return { cmd: 'expr', expr: joined.replace(new RegExp('\\s*([.\\-+×÷%√])\\s*', 'g'), '$1'), say: raw };
}
function sanitizeExpr(e) {
  // keep only a safe calculator alphabet, drop a leading operator ("divide ten by two" -> 10÷2)
  return e.replace(/−/g, '-').replace(/[^0-9.+\-×÷%√() ]/g, '').trim().replace(/^[+×÷%.]+/, '');
}
function runVoiceCommand(parsed) {
  if (!parsed) return;
  const t = T[state.lang];
  if (parsed.cmd === 'stop') return stopListening();
  if (parsed.cmd === 'clear') { pressKey('C'); return; }
  if (parsed.cmd === 'dark')  { state.themeMode = 'dark';  localStorage.setItem('themeMode','dark');  applyTheme(); toast('🌙'); return; }
  if (parsed.cmd === 'light') { state.themeMode = 'light'; localStorage.setItem('themeMode','light'); applyTheme(); toast('☀️'); return; }
  const clean = sanitizeExpr(parsed.expr);
  if (!clean || !/[0-9]/.test(clean)) { toast('🤔 ' + parsed.say); return; }
  state.expr = clean.replace(/-/g, '−');
  state.justEvaluated = false;
  render();
  showBadge(t.understood + ' ' + parsed.say);
  doEquals(false);
}

/* ---------- Speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, listening = false;
function toggleVoice() {
  if (listening) return stopListening();
  if (!SR) { toast(T[state.lang].unsupported); return; }
  recog = new SR();
  recog.lang = state.voiceLang;
  recog.interimResults = false;
  recog.maxAlternatives = 1;
  recog.onstart = () => {
    listening = true;
    $('#btnSettings').classList.add('mic-live');
    toast(T[state.lang].listening);
    showBadge('🎤 ' + T[state.lang].listening);
  };
  recog.onresult = e => {
    const text = e.results[0][0].transcript;
    runVoiceCommand(parseVoice(text));
  };
  recog.onerror = e => { if (e.error === 'not-allowed') toast('🎤 🔒'); };
  recog.onend = () => stopListening(false);
  try { recog.start(); } catch { /* already started */ }
}
function stopListening(fromCmd = true) {
  if (recog && listening) { try { recog.stop(); } catch {} }
  listening = false;
  $('#btnSettings').classList.remove('mic-live');
  if (fromCmd) hideBadge();
}
function showBadge(txt) {
  const b = $('#voiceBadge');
  b.textContent = txt; b.classList.add('show');
  clearTimeout(b._t); b._t = setTimeout(hideBadge, 3500);
}
function hideBadge() { $('#voiceBadge').classList.remove('show'); }

/* ---------- Text to speech ---------- */
function speakResult() {
  if (!state.tts || !window.speechSynthesis) return;
  const txt = $('#result').textContent;
  if (!txt || txt === '0') return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt.replace('٫', ' فاصلة '));
  const ar = state.voiceLang.startsWith('ar');
  u.lang = ar ? 'ar-SA' : 'en-US';
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v => v.lang && v.lang.startsWith(ar ? 'ar' : 'en'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
$('#btnSpeak').addEventListener('click', speakResult);

/* ---------- Round result ---------- */
$('#btnRound').addEventListener('click', () => {
  let v = null;
  if (state.expr) { try { v = evaluate(tokenize(state.expr)); } catch { toast(T[state.lang].error); return; } }
  else if (state.lastResult !== null) v = state.lastResult;
  if (v === null) { toast(T[state.lang].noResult); return; }
  const r = Math.round(v);                    // تقريب لأقرب عدد صحيح
  state.lastResult = r; state.expr = ''; state.justEvaluated = true;
  render('≈ ' + fmt(v));
  $('#result').textContent = fmt(r);
  $('#result').dataset.hold = fmt(r);
  toast(T[state.lang].rounded);
  speakResult();
});
speechSynthesis.onvoiceschanged = () => {};

/* ---------- Settings sheet wiring ---------- */
$('#btnSettings').addEventListener('click', () => { $('#sheet').classList.add('open'); $('#backdrop').classList.add('open'); });
$('#btnCloseSheet').addEventListener('click', closeSheet);
$('#backdrop').addEventListener('click', closeSheet);
function closeSheet() { $('#sheet').classList.remove('open'); $('#backdrop').classList.remove('open'); }

document.querySelectorAll('#modeChips .chip').forEach(c => c.addEventListener('click', () => {
  state.themeMode = c.dataset.mode; localStorage.setItem('themeMode', c.dataset.mode); applyTheme();
}));
document.querySelectorAll('#accentDots .dot').forEach(d => d.addEventListener('click', () => {
  state.accent = d.dataset.accent; localStorage.setItem('accent', state.accent); applyTheme();
}));
document.querySelectorAll('#langChips .chip').forEach(c => c.addEventListener('click', () => {
  state.lang = c.dataset.lang; localStorage.setItem('lang', state.lang); applyLang(); render();
}));
document.querySelectorAll('#voiceChips .chip').forEach(c => c.addEventListener('click', () => {
  state.voiceLang = c.dataset.voice; localStorage.setItem('voiceLang', state.voiceLang); applyLang();
}));
$('#ttsSwitch').addEventListener('click', () => {
  state.tts = !state.tts; localStorage.setItem('tts', state.tts ? '1' : '0'); applyLang();
});

/* ---------- Physical keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9' || e.key === '.') pressKey(e.key);
  else if (e.key === '+') pressKey('+');
  else if (e.key === '-') pressKey('−');
  else if (e.key === '*') pressKey('×');
  else if (e.key === '/') { e.preventDefault(); pressKey('÷'); }
  else if (e.key === 'Enter' || e.key === '=') pressKey('=');
  else if (e.key === 'Backspace') pressKey('⌫');
  else if (e.key === 'Escape') pressKey('C');
  else if (e.key === '%') pressKey('%');
  else if (e.key === 'Delete') pressKey('C');
});

/* ---------- Init ---------- */
applyTheme(); applyLang(); render();
setTimeout(() => toast(T[state.lang].voiceOn), 600);
</script>
</body>
</html>
