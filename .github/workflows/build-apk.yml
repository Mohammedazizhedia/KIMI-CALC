name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          unzip -o calc-project.zip
          cd calc-project
          mkdir -p www
          cp index.html www/
          cp -r fonts www/fonts
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npm i -D @capacitor/assets
          npx cap init Calculator com.mohammed.calculator --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: calc-project/android/app/build/outputs/apk/debug/app-debug.apk
